spring.application.name=E-commerce_Backoffice

# [DB Info]
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# [JPA/Hibernate Config]
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# 실행 시 SQL 초기화 스크립트를 항상 실행
spring.sql.init.mode=always
# 실행할 스키마 SQL 파일 위치 지정
spring.sql.init.schema-locations=classpath:index.sql
# JPA가 테이블 생성/수정(hbm2ddl) 작업을 먼저 수행한 후
# 위 SQL 초기화 스크립트가 실행되도록 순서를 지연시킴
spring.jpa.defer-datasource-initialization=true
# index.sql 실패해도 서버 계속 실행
spring.sql.init.continue-on-error=true

# [Formatting]
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# [JWT Config]
jwt.secret.key=${JWT_SECRET_KEY}

# [security log]
logging.level.org.springframework.security=DEBUG

